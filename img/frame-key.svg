<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 470" width="1320" height="470" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1320" height="470" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#1f2328">Each frame (and each face) gets its own key from one password</text>
  <text x="40" y="78" font-size="17" fill="#57606a">this is exactly what frame_key() and _streams() in chaos.py do</text>

  <!-- inputs -->
  <g stroke="#c9ced4" stroke-width="2" fill="#f6f8fa">
    <rect x="40" y="120" width="290" height="80" rx="14"/>
    <rect x="40" y="230" width="290" height="80" rx="14"/>
  </g>
  <text x="185" y="152" font-size="19" font-weight="700" text-anchor="middle" fill="#1f2328">master password</text>
  <text x="185" y="180" font-size="16" text-anchor="middle" fill="#57606a">"zahraa-secret-2026", kept secret</text>
  <text x="185" y="262" font-size="19" font-weight="700" text-anchor="middle" fill="#1f2328">frame number n</text>
  <text x="185" y="290" font-size="16" text-anchor="middle" fill="#57606a">+ face number k in face mode</text>

  <!-- joiner -->
  <g stroke="#c9ced4" stroke-width="2" fill="none">
    <path d="M330 160 H380 V215 M330 270 H380 V215 M380 215 H425"/>
  </g>

  <!-- sha -->
  <rect x="430" y="175" width="190" height="80" rx="14" fill="#f6f8fa" stroke="#c9ced4" stroke-width="2"/>
  <text x="525" y="207" font-size="19" font-weight="700" text-anchor="middle" fill="#1f2328">SHA-256</text>
  <text x="525" y="235" font-size="16" text-anchor="middle" fill="#57606a">hashlib, 32 bytes</text>
  <path d="M620 215 H672" stroke="#c9ced4" stroke-width="2" fill="none"/>
  <path d="M664 208 L678 215 L664 222 Z" fill="#c9ced4"/>

  <!-- key -->
  <rect x="680" y="160" width="250" height="110" rx="14" fill="#dbe8fb" stroke="#1f6feb" stroke-width="3"/>
  <text x="805" y="195" font-size="19" font-weight="700" text-anchor="middle" fill="#1f2328">key for this frame</text>
  <text x="805" y="223" font-size="16" text-anchor="middle" fill="#1f2328">x0 between 0.1 and 0.9</text>
  <text x="805" y="248" font-size="16" text-anchor="middle" fill="#1f2328">r between 3.99 and 4.0</text>
  <path d="M930 215 H982" stroke="#c9ced4" stroke-width="2" fill="none"/>
  <path d="M974 208 L988 215 L974 222 Z" fill="#c9ced4"/>

  <!-- logistic -->
  <rect x="990" y="175" width="290" height="80" rx="14" fill="#f6f8fa" stroke="#c9ced4" stroke-width="2"/>
  <text x="1135" y="207" font-size="19" font-weight="700" text-anchor="middle" fill="#1f2328">logistic sequence</text>
  <text x="1135" y="235" font-size="16" text-anchor="middle" fill="#57606a">skip 1000, then 3 x N values</text>

  <!-- three outputs -->
  <g stroke="#c9ced4" stroke-width="2" fill="none">
    <path d="M1010 255 V300 M1135 255 V300 M1230 255 V300"/>
  </g>
  <g fill="#c9ced4">
    <path d="M1003 295 L1010 309 L1017 295 Z"/>
    <path d="M1128 295 L1135 309 L1142 295 Z"/>
    <path d="M1223 295 L1230 309 L1237 295 Z"/>
  </g>
  <g>
    <rect x="926" y="312" width="166" height="74" rx="12" fill="#f6f8fa" stroke="#c9ced4" stroke-width="2"/>
    <text x="1009" y="341" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">first third</text>
    <text x="1009" y="366" font-size="14" text-anchor="middle" fill="#57606a">argsort = permutation</text>

    <rect x="1098" y="312" width="74" height="74" rx="12" fill="#f6f8fa" stroke="#c9ced4" stroke-width="2"/>
    <text x="1135" y="341" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">second</text>
    <text x="1135" y="366" font-size="14" text-anchor="middle" fill="#57606a">bytes k1</text>

    <rect x="1178" y="312" width="102" height="74" rx="12" fill="#f6f8fa" stroke="#c9ced4" stroke-width="2"/>
    <text x="1229" y="341" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">third</text>
    <text x="1229" y="366" font-size="14" text-anchor="middle" fill="#57606a">bytes k2</text>
  </g>

  <text x="40" y="420" font-size="17" fill="#57606a">frame n + 1 goes through the same steps and gets a different x0 and r, so its permutation and keystreams differ</text>
  <text x="40" y="448" font-size="17" fill="#57606a">the receiver repeats exactly this with the same password and the frame / face numbers from the metadata file</text>
</svg>
